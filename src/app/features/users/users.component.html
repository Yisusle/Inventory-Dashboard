<section class="page-header">
  <div>
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h1>Usuarios</h1>
    <p>Personas con acceso a la plataforma.</p>
  </div>
</section>

<mat-card>
  <mat-card-content>
    @if (isLoading()) {
      <div class="loading"><mat-spinner diameter="36" /></div>
    } @else {
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Registro</th></tr></thead>
          <tbody>
            @for (user of users(); track user.id) {
              <tr><td><strong>{{ user.username }}</strong></td><td>{{ user.email }}</td><td><span class="role">{{ user.role }}</span></td><td>{{ user.createdAt | date: 'mediumDate' }}</td></tr>
            } @empty {
              <tr>
                <td colspan="4" class="empty">
                  <img src="illustrations/empty-state.svg" alt="No hay usuarios" />
                  <p>No hay usuarios registrados.</p>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
      <mat-paginator
        [length]="total()"
        [pageIndex]="page()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[10, 25, 50]"
        (page)="changePage($event)"
      />
    }
  </mat-card-content>
</mat-card>
