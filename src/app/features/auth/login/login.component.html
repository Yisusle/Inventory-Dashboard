<main class="login-page">
  <mat-card class="login-card">
    <img class="hero-illustration" src="illustrations/auth-hero.svg" alt="Panel de inventario ilustrado" />
    <mat-card-header>
      <div mat-card-avatar class="brand-icon"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i></div>
      <mat-card-title>Stockwise</mat-card-title>
      <mat-card-subtitle>Administración de inventario</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-icon matSuffix>person</mat-icon>
          @if (form.controls.username.hasError('required')) {
            <mat-error>Ingresa tu usuario.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-icon matSuffix>lock</mat-icon>
          @if (form.controls.password.hasError('required')) {
            <mat-error>Ingresa tu contraseña.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <mat-spinner diameter="20" />
          } @else {
            Iniciar sesión
          }
        </button>
        <a routerLink="/register">¿No tienes cuenta? Regístrate</a>
      </form>
    </mat-card-content>
  </mat-card>
</main>
